name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            dll: AutoSavePlugin_64.dll
          - rid: win-x86
            dll: AutoSavePlugin_32.dll
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # v2.1.0 tag -> 2.1.0; other builds -> 0.0.0-ci.<run number>
      - name: Version
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Publish native DLL
        run: dotnet publish AutoSavePlugin/AutoSavePlugin.csproj -c Release -r ${{ matrix.rid }} -o publish -p:Version=${{ env.VERSION }}

      # Unit tests plus integration tests that load the published DLL like PL/SQL Developer does.
      # The test process is 64-bit, so the native DLL can only be loaded in the x64 job.
      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test --solution AutoSavePlugin.slnx -c Release -p:Version=${{ env.VERSION }}
        env:
          AUTOSAVE_PLUGIN_DLL: publish/AutoSavePlugin.dll

      - name: Rename
        run: Copy-Item publish/AutoSavePlugin.dll ${{ matrix.dll }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dll }}
          path: ${{ matrix.dll }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: AutoSavePlugin_*.dll
          generate_release_notes: true
